<!DOCTYPE html>
<html lang="en" data-theme="spotify">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statify — Your music. Decoded.</title>
<meta name="description" content="Statify — your music. Decoded. A premium music analytics dashboard for Spotify listeners: top tracks, top artists, listening history and long-term trends.">
<meta name="application-name" content="Statify">
<meta name="apple-mobile-web-app-title" content="Statify">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Statify">
<meta property="og:title" content="Statify — Your music. Decoded.">
<meta property="og:description" content="Premium music analytics for Spotify listeners. Top tracks, artists, listening history and long-term trends.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Statify — Your music. Decoded.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231db954'/%3E%3Cpath d='M8 21V11m5 10V8m5 13v-7m5 7V13' stroke='%23000' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Statify — design system
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#000000;
  --bg-1:#0a0a0c;
  --bg-2:#111114;
  --bg-3:#17171b;
  --bg-4:#1f1f24;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --txt:#ffffff;
  --txt-2:#b4b4bb;
  --txt-3:#7a7a83;
  --accent:#1db954;
  --accent-2:#1ed760;
  --accent-ink:#04130a;
  --accent-soft:rgba(29,185,84,.12);
  --accent-line:rgba(29,185,84,.35);
  --warn:#f5a524;
  --danger:#f2555a;
  --info:#5b9dff;
  --violet:#a06bff;
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:9px;
  --shadow:0 18px 50px -22px rgba(0,0,0,.85);
  --shadow-sm:0 8px 24px -14px rgba(0,0,0,.8);
  --ease:cubic-bezier(.22,.61,.36,1);
  --sidebar:250px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="midnight"]{--bg:#05070f;--bg-1:#080b16;--bg-2:#0d1220;--bg-3:#131a2c;--bg-4:#1b2440;--accent:#5b8cff;--accent-2:#7ea6ff;--accent-ink:#040a1a;--accent-soft:rgba(91,140,255,.13);--accent-line:rgba(91,140,255,.38)}
html[data-theme="neon"]{--bg:#07060c;--bg-1:#0b0812;--bg-2:#120c1c;--bg-3:#1a1028;--bg-4:#241636;--accent:#e64bff;--accent-2:#4bf5ff;--accent-ink:#12001a;--accent-soft:rgba(230,75,255,.13);--accent-line:rgba(230,75,255,.38)}
html[data-theme="mono"]{--bg:#000;--bg-1:#0b0b0b;--bg-2:#131313;--bg-3:#1b1b1b;--bg-4:#252525;--accent:#f2f2f2;--accent-2:#ffffff;--accent-ink:#0a0a0a;--accent-soft:rgba(255,255,255,.10);--accent-line:rgba(255,255,255,.28)}
html[data-theme="sunset"]{--bg:#0c0705;--bg-1:#130b08;--bg-2:#1c110c;--bg-3:#271712;--bg-4:#341f18;--accent:#ff7a45;--accent-2:#ffb057;--accent-ink:#1a0a02;--accent-soft:rgba(255,122,69,.13);--accent-line:rgba(255,122,69,.38)}

body{
  background:var(--bg);color:var(--txt);font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:15px;line-height:1.5;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 12% -8%, color-mix(in srgb,var(--accent) 12%, transparent), transparent 60%),
    radial-gradient(700px 420px at 100% 0%, color-mix(in srgb,var(--accent-2) 8%, transparent), transparent 65%);
  opacity:.9;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:content-box}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,var(--bg-1),color-mix(in srgb,var(--bg-1) 70%, var(--bg)));
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 16px}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:0 6px 20px -6px color-mix(in srgb,var(--accent) 70%, transparent)}
.brand-mark svg{width:19px;height:19px}
.brand-name{font-weight:800;letter-spacing:-.03em;font-size:19px}
.brand-sub{font-size:11px;color:var(--txt-3);letter-spacing:.01em;margin-top:1px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3);padding:16px 12px 7px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:var(--radius-xs);
  color:var(--txt-2);font-weight:550;font-size:14px;transition:background .18s var(--ease),color .18s var(--ease);
  position:relative;width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-item:hover{background:var(--bg-3);color:var(--txt)}
.nav-item.active{background:var(--accent-soft);color:var(--txt)}
.nav-item.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:19px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav-item.active svg{color:var(--accent);opacity:1}
.nav-badge{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2.5px 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink);text-transform:uppercase}
.nav-lock{margin-left:auto;opacity:.55}
.sidebar-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:13px 26px;background:color-mix(in srgb,var(--bg) 78%, transparent);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--line);
}
.view{flex:1;padding:26px 26px 120px;max-width:1500px;width:100%;margin:0 auto;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.view-head{margin-bottom:22px}
.view-head h1{font-size:clamp(23px,3.4vw,32px);letter-spacing:-.035em;margin:0 0 5px;font-weight:800}
.view-head p{margin:0;color:var(--txt-2);max-width:74ch;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:9px}

/* ---------- mobile tabbar ---------- */
.tabbar{display:none}

/* ---------- components ---------- */
.card{background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.card-head h2,.card-head h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.card-head p{margin:2px 0 0;font-size:12.5px;color:var(--txt-3)}
.card-head .spacer{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.mt{margin-top:16px}.mt-s{margin-top:9px}
.muted{color:var(--txt-2)}.dim{color:var(--txt-3)}
.tiny{font-size:12px}.small{font-size:13px}
.center{text-align:center}
.spacer{margin-left:auto}
.hide{display:none !important}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 17px;border-radius:999px;font-weight:650;font-size:13.5px;
  border:1px solid var(--line-2);background:var(--bg-3);color:var(--txt);
  transition:transform .16s var(--ease),background .18s var(--ease),border-color .18s,opacity .18s;
  white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--bg-4);border-color:var(--line-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent;font-weight:750}
.btn-primary:hover{background:linear-gradient(135deg,var(--accent-2),var(--accent));filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ghost:hover{background:var(--bg-3)}
.btn-danger{border-color:color-mix(in srgb,var(--danger) 45%, transparent);color:var(--danger);background:color-mix(in srgb,var(--danger) 10%, transparent)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 18%, transparent)}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn-lg{padding:13px 26px;font-size:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;border:1px solid var(--line-2);background:var(--bg-3);color:var(--txt-2)}
.badge svg{width:12px;height:12px}
.badge-accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2)}
.badge-warn{background:rgba(245,165,36,.12);border-color:rgba(245,165,36,.4);color:var(--warn)}
.badge-danger{background:rgba(242,85,90,.12);border-color:rgba(242,85,90,.4);color:var(--danger)}
.badge-info{background:rgba(91,157,255,.12);border-color:rgba(91,157,255,.4);color:var(--info)}
.badge-live{background:rgba(29,185,84,.16);border-color:var(--accent-line);color:var(--accent-2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%, transparent)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6.5px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--txt-2);font-size:12.5px;font-weight:600;transition:.18s var(--ease)}
.chip:hover{background:var(--bg-3);color:var(--txt)}
.chip.active{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.seg{display:inline-flex;padding:3px;gap:3px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px}
.seg .chip{border:0;background:transparent;padding:6px 13px}
.seg .chip.active{background:var(--accent);color:var(--accent-ink)}

.stat{padding:17px 18px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.stat .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);font-weight:650}
.stat .v{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.12}
.stat .s{font-size:12px;color:var(--txt-3)}
.stat .ico{position:absolute;right:15px;top:15px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2)}
.stat .ico svg{width:16px;height:16px}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--accent-2)}.delta.down{color:var(--danger)}

/* ---------- cover art ---------- */
.cover{width:46px;height:46px;border-radius:10px;flex:none;object-fit:cover;background:var(--bg-4);box-shadow:0 4px 14px -6px rgba(0,0,0,.9)}
.cover.round{border-radius:50%}
.cover.lg{width:76px;height:76px;border-radius:14px}
.cover.xl{width:100%;aspect-ratio:1;height:auto;border-radius:var(--radius)}
.cover-wrap{position:relative;flex:none}
.rank{font-variant-numeric:tabular-nums;font-weight:750;color:var(--txt-3);width:24px;text-align:right;flex:none;font-size:14px}
.rank.top{color:var(--accent-2)}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:13px;padding:10px 20px;border-bottom:1px solid var(--line);transition:background .16s var(--ease);position:relative}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--bg-3)}
.trow .meta{min-width:0;flex:1}
.trow .t{font-weight:620;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .a{font-size:12.5px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .trail{text-align:right;flex:none;font-size:12px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.pop{width:64px;height:4px;border-radius:3px;background:var(--bg-4);overflow:hidden;margin-top:5px}
.pop i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:3px}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart-wrap{padding:16px 18px 8px;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 20px 18px;font-size:12px;color:var(--txt-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}
.tip{
  position:fixed;z-index:80;pointer-events:none;padding:8px 11px;border-radius:10px;font-size:12px;
  background:var(--bg-4);border:1px solid var(--line-2);box-shadow:var(--shadow);opacity:0;transition:opacity .12s;
  max-width:230px;line-height:1.4;
}
.tip.show{opacity:1}
.tip b{display:block;margin-bottom:2px}
.tip i{font-style:normal;color:var(--txt-2)}

.empty{padding:44px 24px;text-align:center;color:var(--txt-3)}
.empty svg{width:36px;height:36px;opacity:.4;margin-bottom:10px}
.empty h4{margin:0 0 4px;color:var(--txt-2);font-size:15px}
.empty p{margin:0 auto;max-width:44ch;font-size:13px}

/* ---------- lock / upsell ---------- */
.lock{position:relative;overflow:hidden;border-radius:var(--radius)}
.lock-veil{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:26px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%, transparent),color-mix(in srgb,var(--bg) 90%, transparent));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.lock-veil .inner{max-width:360px}
.lock-veil svg{width:28px;height:28px;color:var(--accent-2);margin-bottom:8px}
.lock-veil h4{margin:0 0 5px;font-size:16px}
.lock-veil p{margin:0 0 14px;font-size:13px;color:var(--txt-2)}
.blurred{filter:blur(6px) saturate(.7);opacity:.5;pointer-events:none;user-select:none}

.plus-tag{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-weight:800;font-size:10px;letter-spacing:.09em;padding:3px 7px;border-radius:6px;text-transform:uppercase}

/* ---------- pricing ---------- */
.price-card{position:relative;padding:26px 24px;display:flex;flex-direction:column;gap:16px;border-radius:22px}
.price-card.featured{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line),0 26px 60px -30px color-mix(in srgb,var(--accent) 60%, transparent)}
.price-card .ribbon{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:5px 13px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.price{display:flex;align-items:flex-end;gap:6px}
.price .amt{font-size:44px;font-weight:850;letter-spacing:-.045em;line-height:1}
.price .per{color:var(--txt-3);font-size:13.5px;padding-bottom:6px}
.strike{text-decoration:line-through;color:var(--txt-3)}
.feat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.feat-list li{display:flex;gap:10px;align-items:flex-start;color:var(--txt-2)}
.feat-list svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent-2)}
.feat-list li.off svg{color:var(--txt-3)}
.feat-list li.off{color:var(--txt-3)}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
table.tbl th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);font-weight:700;position:sticky;top:0;background:var(--bg-2)}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tbody tr:hover{background:var(--bg-3)}
table.tbl td .tick{color:var(--accent-2)}
table.tbl td .cross{color:var(--txt-3)}

.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--bg-2);font-size:13px;color:var(--txt-2)}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px}
.banner.warn{border-color:rgba(245,165,36,.35);background:rgba(245,165,36,.07);color:#f7c877}
.banner.warn svg{color:var(--warn)}
.banner.info{border-color:rgba(91,157,255,.32);background:rgba(91,157,255,.07);color:#a9c9ff}
.banner.info svg{color:var(--info)}
.banner.ok{border-color:var(--accent-line);background:var(--accent-soft);color:#8ee6a8}
.banner.ok svg{color:var(--accent-2)}
.banner b{color:var(--txt)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:650;color:var(--txt-2)}
.field .hint{font-size:11.5px;color:var(--txt-3)}
.input{width:100%;padding:10px 13px;border-radius:var(--radius-xs);background:var(--bg-1);border:1px solid var(--line-2);transition:.16s var(--ease)}
.input:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.switch{position:relative;width:44px;height:25px;border-radius:999px;background:var(--bg-4);border:1px solid var(--line-2);transition:.2s var(--ease);flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--txt-2);transition:.2s var(--ease)}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on::after{transform:translateX(19px);background:var(--accent-ink)}
.setting{display:flex;align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting .txt{flex:1;min-width:0}
.setting .txt b{display:block;font-size:14px;font-weight:620}
.setting .txt span{font-size:12.5px;color:var(--txt-3)}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s var(--ease)}
.modal{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:22px;box-shadow:var(--shadow);animation:pop .26s var(--ease)}
.modal.wide{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2);z-index:2}
.modal-head h3{margin:0;font-size:17px;letter-spacing:-.02em}
.modal-body{padding:22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg-2)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(370px,92vw)}
.toast{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:var(--bg-3);border:1px solid var(--line-2);box-shadow:var(--shadow);animation:slide .3s var(--ease);font-size:13px}
@keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.toast svg{width:17px;height:17px;flex:none;margin-top:1px}
.toast.ok svg{color:var(--accent-2)}.toast.err svg{color:var(--danger)}.toast.info svg{color:var(--info)}
.toast b{display:block;margin-bottom:1px}
.toast p{margin:0;color:var(--txt-2);font-size:12.5px}

/* ---------- skeletons ---------- */
.sk{background:linear-gradient(90deg,var(--bg-3) 25%,var(--bg-4) 50%,var(--bg-3) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:8px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- referral ---------- */
.ref-link{display:flex;gap:8px;align-items:center;background:var(--bg-1);border:1px dashed var(--line-2);border-radius:var(--radius-xs);padding:11px 13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;overflow:auto}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:14px;padding:0 0 20px;position:relative}
.tl-item::before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:1.5px;background:var(--line-2)}
.tl-item:last-child::before{display:none}
.tl-dot{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--accent);background:var(--bg);flex:none;margin-top:3px;z-index:1}
.tl-item.pending .tl-dot{border-color:var(--txt-3)}

.kpi-spark{display:flex;align-items:flex-end;gap:2.5px;height:30px}
.kpi-spark i{flex:1;background:var(--accent-soft);border-radius:2px 2px 0 0;min-height:3px}

/* ---------- loading screen ---------- */
.splash{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:var(--bg);transition:opacity .45s var(--ease),visibility .45s var(--ease)}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash .inner{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;animation:fade .5s var(--ease)}
.splash .mark{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:0 14px 40px -14px color-mix(in srgb,var(--accent) 75%, transparent);animation:pulse 1.9s var(--ease) infinite}
.splash .mark svg{width:30px;height:30px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.splash .nm{font-size:25px;font-weight:800;letter-spacing:-.035em;margin-top:12px}
.splash .tl{font-size:12.5px;color:var(--txt-3)}
.splash .bar{width:150px;height:3px;border-radius:3px;background:var(--bg-4);overflow:hidden;margin-top:14px}
.splash .bar i{display:block;height:100%;width:42%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));animation:load 1.15s var(--ease) infinite}
@keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(340%)}}

/* ---------- footer ---------- */
.footer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 26px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--txt-3);font-size:12.5px;max-width:1500px;width:100%;margin:0 auto}
.footer .brand-mini{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--txt)}
.footer .brand-mini .brand-mark{width:26px;height:26px;border-radius:9px}
.footer .lnk{background:none;border:0;padding:0;color:var(--txt-2);font-size:12.5px;cursor:pointer;transition:color .16s var(--ease)}
.footer .lnk:hover{color:var(--accent-2)}
.footer .legal{flex-basis:100%;font-size:11.5px;color:var(--txt-3);line-height:1.6}
.modal .brand-mark{margin:0 auto 14px}
.modal .brand-mark svg{width:26px;height:26px}

/* ---------- responsive ---------- */
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1024px){
  #app{grid-template-columns:1fr}
  .sidebar{display:none}
  .view{padding:20px 16px 130px}
  .topbar{padding:11px 16px}
  .g23,.g32,.g3{grid-template-columns:1fr}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:color-mix(in srgb,var(--bg-1) 92%, transparent);backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line);
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--txt-3);font-size:10px;font-weight:620;border-radius:10px;transition:.16s}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.active{color:var(--accent-2)}
}
@media(max-width:640px){
  .g4,.g2{grid-template-columns:1fr}
  .hide-sm{display:none}
  .view-head h1{font-size:24px}
  .stat .v{font-size:23px}
  .cover.lg{width:60px;height:60px}
  .modal{border-radius:20px}
  .toasts{right:10px;left:10px;bottom:84px;max-width:none}
  .price-card{padding:22px 18px}
  .trow{padding:10px 14px;gap:10px}
  .trow .trail{display:none}
  .card-pad{padding:16px}
  .footer{padding-bottom:96px}
}
@media print{
  .sidebar,.topbar,.tabbar,.toasts,.splash,.footer,.no-print{display:none !important}
  #app{grid-template-columns:1fr}
  body{background:#fff;color:#000}
  body::before{display:none}
  .card{border:1px solid #ddd;box-shadow:none;break-inside:avoid}
  .view{padding:0}
}

  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};

/* deterministic 32-bit hash -> used for generated cover art + stable ids */
function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
function hsl(h, s, l) { return `hsl(${h} ${s}% ${l}%)`; }

/* Generated cover art used ONLY when Spotify supplies no image.
   Never presented as real album artwork. */
function artFor(name, seed) {
  const h = hashStr(String(seed || name || 'statify'));
  const h1 = h % 360, h2 = (h1 + 40 + (h >> 8) % 80) % 360;
  const initials = String(name || '?').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>` +
    `<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>` +
    `<stop offset='0' stop-color='${hsl(h1, 62, 30)}'/><stop offset='1' stop-color='${hsl(h2, 58, 14)}'/></linearGradient></defs>` +
    `<rect width='100' height='100' fill='url(%23g)'/>` +
    `<circle cx='${20 + h % 60}' cy='${18 + (h >> 4) % 60}' r='${26 + (h >> 6) % 22}' fill='${hsl(h2, 70, 55)}' opacity='.20'/>` +
    `<text x='50' y='58' font-family='Inter,sans-serif' font-size='30' font-weight='800' fill='white' opacity='.82' text-anchor='middle'>${initials}</text>` +
    `</svg>`;
  return 'data:image/svg+xml,' + svg.replace(/#/g, '%23');
}

/* ============================================================
   Store — namespaced, quota-safe localStorage
   ============================================================ */
const Store = {
  ns: 'statify.v1.',
  get(k, fb) {
    try { const v = localStorage.getItem(this.ns + k); return v == null ? fb : JSON.parse(v); }
    catch (e) { return fb; }
  },
  set(k, v) {
    try { localStorage.setItem(this.ns + k, JSON.stringify(v)); return true; }
    catch (e) { console.warn('store full', e); return false; }
  },
  del(k) { try { localStorage.removeItem(this.ns + k); } catch (e) {} },
  /* wipe everything Statify owns (used by 'delete my data') */
  wipeAll() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(this.ns)) keys.push(k);
    }
    keys.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
    return keys.length;
  }
};

/* ============================================================
   Toast + Modal
   ============================================================ */
function toast(title, msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'info');
  const ic = kind === 'ok' ? I.check : kind === 'err' ? I.warn : I.info;
  el.innerHTML = ic + '<div><b>' + esc(title) + '</b>' + (msg ? '<p>' + esc(msg) + '</p>' : '') + '</div>';
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 300); }, 4200);
}

function modal(opts) {
  const root = $('#modal-root');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML =
    '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3>' + esc(opts.title || '') + '</h3>' +
        '<button class="btn btn-ghost btn-sm spacer" data-close aria-label="Close">' + I.x + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') +
    '</div>';
  root.appendChild(ov);
  const close = () => { ov.remove(); if (opts.onClose) opts.onClose(); };
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.closest('[data-close]')) close();
    if (opts.onClick) opts.onClick(e, close);
  });
  document.addEventListener('keydown', function onEsc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); }
  });
  return { el: ov, close };
}

/* ============================================================
   Router (hash based, keeps back-button behaviour sane)
   ============================================================ */
const ROUTES = ['dashboard','tracks','artists','history','analytics','search','reports','referrals','upgrade','settings','privacy','owner'];
function go(view) {
  if (!ROUTES.includes(view)) view = 'dashboard';
  if (location.hash !== '#/' + view) { location.hash = '#/' + view; }
  else { State.view = view; render(); }
}
function currentRoute() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  return ROUTES.includes(h) ? h : 'dashboard';
}

/* apply theme */
function applyTheme(name) {
  const t = CONFIG.themes[name] || CONFIG.themes.spotify;
  if (t.tier === 'plus' && !Entitlements.has('themes')) {
    toast('Theme locked', 'Additional themes are part of Statify Plus.', 'err');
    return false;
  }
  State.theme = name; Store.set('theme', name);
  document.documentElement.setAttribute('data-theme', name);
  return true;
}

/* ============================================================
   SAMPLE DATA
   Clearly labelled everywhere it appears. Kept in its own object
   so it can never be confused with real Spotify data.
   ============================================================ */
const SAMPLE = (function () {
  const A = (id, name, genres, followers, popularity) => ({ id, name, genres, followers, popularity, image: null });
  const artists = [
    A('a1', 'Nova Reyes', ['indie pop', 'dream pop'], 1840000, 78),
    A('a2', 'Kite & Compass', ['alt rock', 'indie rock'], 960000, 71),
    A('a3', 'Low Orbit', ['electronic', 'synthwave'], 1420000, 75),
    A('a4', 'Marla Quinn', ['singer-songwriter', 'folk'], 610000, 68),
    A('a5', 'Static Bloom', ['shoegaze', 'noise pop'], 430000, 63),
    A('a6', 'Yusuf Adeyemi', ['afrobeat', 'neo-soul'], 2210000, 82),
    A('a7', 'Paper Harbour', ['indie folk', 'chamber pop'], 720000, 69),
    A('a8', 'VELVET//CODE', ['industrial', 'darkwave'], 380000, 60),
    A('a9', 'Iris Kwan', ['r&b', 'alt r&b'], 1130000, 73),
    A('a10', 'The Long Sunday', ['post-rock', 'ambient'], 290000, 57),
    A('a11', 'Cassette Youth', ['bedroom pop', 'lo-fi'], 540000, 66),
    A('a12', 'Dmitri Vale', ['piano', 'modern classical'], 210000, 54),
    A('a13', 'Halo Method', ['house', 'deep house'], 880000, 70),
    A('a14', 'June Alvarado', ['latin pop', 'dance pop'], 3050000, 85),
    A('a15', 'Ghost Radio', ['trip hop', 'downtempo'], 460000, 62),
    A('a16', 'The Fenwick Set', ['jazz', 'nu-jazz'], 175000, 51)
  ];
  const titles = [
    'Midnight Cartography', 'Static Bloom', 'Paper Lanterns', 'Slow Machines', 'Neon Rain',
    'Harbour Lights', 'Everything Falls Apart (Gently)', 'Cold Open', 'Orbit Decay', 'Copper Wires',
    'Half a Life', 'Solar Motel', 'Quiet Riot Ave.', 'Undertow', 'Golden Hour Blues',
    'Fault Lines', 'Signal Lost', 'Sunday, 4am', 'Glasshouse', 'Two Weeks in June',
    'Marble Skies', 'The Long Way Down', 'Analog Heart', 'Fever Dream Loop', 'Northbound',
    'Velvet Static', 'Sonder', 'Ash & Ember', 'Parallel Lines', 'Everything in Mono',
    'Low Tide', 'Nightbus', 'Ceramic', 'Winter Chorus', 'Handwriting', 'Dust Motes'
  ];
  const albums = [
    'Nocturne Atlas', 'Warm Static', 'Paper Weather', 'Machine Language', 'Neon Cartography',
    'Long Exposure', 'Soft Failures', 'First Frost', 'Decay Functions', 'Wire & Wood',
    'Half Lives', 'Sunbelt', 'Avenue Songs', 'Tidewater', 'Amber Hours', 'Fault Lines LP'
  ];
  const recentTitles = [
    'Copper Wires', 'Sonder', 'Nightbus', 'Glasshouse', 'Amber Hours', 'Signal Lost', 'Sonder',
    'Orbit Decay', 'Handwriting', 'Neon Rain', 'Low Tide', 'Winter Chorus'
  ];
  /* Generated sample artwork (never presented as real album art).
     Real Spotify data supplies real image URLs at runtime. */
  const covers = {};
  artists.forEach(a => { covers[a.id] = artFor(a.name, a.id); });
  const audioFeatures = {
    danceability: 0.62, energy: 0.58, valence: 0.41, acousticness: 0.34,
    instrumentalness: 0.19, liveness: 0.21, speechiness: 0.08, tempo: 118
  };

  /* deterministic pseudo-random so the demo is stable across reloads */
  function rng(seed) { let s = seed; return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }

  function buildRange(seed, offset) {
    const r = rng(seed);
    const shuffledA = artists.slice().sort((x, y) => (hashStr(x.id + seed) % 997) - (hashStr(y.id + seed) % 997));
    const shuffledT = titles.slice().sort((x, y) => (hashStr(x + seed) % 991) - (hashStr(y + seed) % 991));
    const tracks = [];
    for (let i = 0; i < 20; i++) {
      const ar = shuffledA[(i + offset) % shuffledA.length];
      const nm = shuffledT[(i + offset * 3) % shuffledT.length];
      tracks.push({
        id: 'st' + seed + i, name: nm, artist: ar.name, artistId: ar.id,
        album: albums[(hashStr(nm) % albums.length)],
        image: covers[ar.id] || null,
        popularity: clamp(Math.round(92 - i * 2.1 + r() * 4), 30, 99),
        duration_ms: 168000 + Math.round(r() * 96000),
        explicit: r() > 0.86
      });
    }
    const topArtists = shuffledA.slice(0, 12).map((ar, i) => Object.assign({}, ar, {
      rank: i + 1, image: covers[ar.id] || null,
      /* share of the top-50 tracks that belong to this artist — a real, derivable number */
      topTrackCount: tracks.filter(t => t.artistId === ar.id).length,
      popularity: clamp(ar.popularity - i + 2, 30, 99)
    }));
    return { tracks, artists: topArtists };
  }

  const ranges = {
    short_term:  buildRange(17, 0),
    medium_term: buildRange(41, 3),
    long_term:   buildRange(88, 6)
  };

  const recent = recentTitles.map((t, i) => {
    const ar = artists[(hashStr(t) % artists.length)];
    return {
      id: 'rp' + i, name: t, artist: ar.name, artistId: ar.id,
      album: albums[hashStr(t + 'a') % albums.length],
      image: covers[ar.id] || null,
      played_at: new Date(Date.now() - (i * 37 + 4) * 60000).toISOString(),
      duration_ms: 180000 + (hashStr(t) % 90000)
    };
  });

  /* 90 days of *recorded* daily activity for the personal history DB demo.
     Values are plays-per-day; the label makes clear this is sample. */
  const daily = (function () {
    const out = []; const r = rng(1234);
    for (let d = 89; d >= 0; d--) {
      const date = daysAgo(d);
      const dow = date.getDay();
      const weekend = (dow === 0 || dow === 6) ? 1.35 : 1;
      const base = 34 * weekend;
      out.push({ date: isoDay(date), plays: Math.max(4, Math.round(base + (r() - 0.45) * 26)) });
    }
    return out;
  })();

  return { artists, tracks: titles, ranges, recent, daily, audioFeatures, covers, profile: null };
})();

/* ============================================================
   DataService — one API for both sample and real Spotify data.
   Every consumer reads `.source` so the UI can label provenance.
   ============================================================ */
const DataService = {
  async getTop(type, range) {
    if (State.connected && Spotify.isReady()) {
      try {
        const items = await Spotify.getTop(type, range, 50);
        return { items, source: 'spotify' };
      } catch (e) {
        State.lastError = e.message;
        toast('Spotify request failed', e.message, 'err');
      }
    }
    const r = SAMPLE.ranges[range] || SAMPLE.ranges.medium_term;
    return { items: type === 'artists' ? r.artists : r.tracks, source: 'sample' };
  },
  async getRecent() {
    if (State.connected && Spotify.isReady()) {
      try { const items = await Spotify.getRecentlyPlayed(50); return { items, source: 'spotify' }; }
      catch (e) { State.lastError = e.message; }
    }
    return { items: SAMPLE.recent, source: 'sample' };
  },
  async getAudioFeatures(ids) {
    if (State.connected && Spotify.isReady()) {
      try { return { items: await Spotify.getAudioFeatures(ids), source: 'spotify' }; }
      catch (e) { return { items: null, source: 'unavailable', reason: e.message }; }
    }
    return { items: null, source: 'sample' };
  },
  async getProfile() {
    if (State.connected && Spotify.isReady()) {
      try { return { item: await Spotify.me(), source: 'spotify' }; }
      catch (e) { return { item: null, source: 'unavailable' }; }
    }
    return { item: null, source: 'sample' };
  },
  async search(q) {
    if (State.connected && Spotify.isReady()) {
      try {
        const r = await Spotify.search(q);
        return { tracks: r.tracks, artists: r.artists, source: 'spotify' };
      } catch (e) { toast('Search failed', e.message, 'err'); }
    }
    /* local sample search so the UI is explorable without a connection */
    const s = q.toLowerCase();
    const tracks = SAMPLE.ranges.long_term.tracks.filter(t => (t.name + ' ' + t.artist).toLowerCase().includes(s)).slice(0, 12);
    const artists = SAMPLE.artists.filter(a => a.name.toLowerCase().includes(s)).slice(0, 12);
    return { tracks, artists, source: 'sample' };
  }
};

/* ============================================================
   Spotify — Authorization Code + PKCE.
   No client secret is ever used or stored in the browser.
   ============================================================ */
const Spotify = {
  TOKEN_KEY: 'spotify_token',
  VERIFIER_KEY: 'spotify_pkce_verifier',
  STATE_KEY: 'spotify_oauth_state',
  connectedAt: Store.get('spotify_connected_at', null),
  account: Store.get('spotify_account', null),

  configured() { return !!(CONFIG.spotify.clientId && CONFIG.spotify.redirectUri); },
  isReady() { return this.connectedAt && !!this.token(); },
  token() {
    const t = Store.get(this.TOKEN_KEY, null);
    if (!t) return null;
    if (t.expires_at && Date.now() > t.expires_at) return null;
    return t.access_token;
  },

  /* random PKCE verifier + S256 challenge */
  b64url(buf) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  rand(n) {
    const a = new Uint8Array(n); crypto.getRandomValues(a);
    return Array.from(a).map(x => ('0' + x.toString(16)).slice(-2)).join('');
  },
  async challenge(verifier) {
    const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return this.b64url(d);
  },

  requestedScopes() {
    const s = CONFIG.spotify.scopes.free.slice();
    if (Entitlements.has('advancedAnalytics')) s.push(...CONFIG.spotify.scopes.extended);
    return s;
  },

  /* Step 1 — send the user to Spotify. */
  async beginAuth() {
    if (!this.configured()) {
      this.showSetupHelp();
      return false;
    }
    const verifier = this.rand(64);
    const state = this.rand(16);
    Store.set(this.VERIFIER_KEY, verifier);
    Store.set(this.STATE_KEY, state);
    const params = new URLSearchParams({
      client_id: CONFIG.spotify.clientId,
      response_type: 'code',
      redirect_uri: CONFIG.spotify.redirectUri,
      scope: this.requestedScopes().join(' '),
      code_challenge_method: 'S256',
      code_challenge: await this.challenge(verifier),
      state
    });
    location.href = CONFIG.spotify.accountsBase + '/authorize?' + params.toString();
    return true;
  },

  /* Step 2 — exchange ?code for tokens, then VERIFY with a real API call.
     We never mark the account connected on the strength of the redirect alone. */
  async handleRedirect() {
    const url = new URL(location.href);
    const code = url.searchParams.get('code');
    const err = url.searchParams.get('error');
    if (err) { toast('Spotify authorisation cancelled', err, 'err'); this.cleanUrl(); return false; }
    if (!code) return false;

    const expected = Store.get(this.STATE_KEY, null);
    if (!expected || expected !== url.searchParams.get('state')) {
      toast('Authorisation failed', 'State mismatch — the request could not be verified.', 'err');
      this.cleanUrl(); return false;
    }
    try {
      const body = new URLSearchParams({
        client_id: CONFIG.spotify.clientId,
        grant_type: 'authorization_code',
        code,
        redirect_uri: CONFIG.spotify.redirectUri,
        code_verifier: Store.get(this.VERIFIER_KEY, '')
      });
      const res = await fetch(CONFIG.spotify.accountsBase + '/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body
      });
      if (!res.ok) throw new Error('Token exchange failed (' + res.status + ')');
      const t = await res.json();
      Store.set(this.TOKEN_KEY, {
        access_token: t.access_token, refresh_token: t.refresh_token,
        expires_at: Date.now() + (t.expires_in - 60) * 1000, scope: t.scope
      });

      /* VERIFY — a real authenticated request must succeed before we claim connection */
      const me = await this.me();
      this.account = { id: me.id, name: me.display_name || me.id, image: (me.images && me.images[0] && me.images[0].url) || null, product: me.product, country: me.country };
      Store.set('spotify_account', this.account);
      this.connectedAt = new Date().toISOString();
      Store.set('spotify_connected_at', this.connectedAt);
      State.connected = true;
      toast('Spotify connected', 'Verified as ' + this.account.name + '.', 'ok');
      this.cleanUrl();
      return true;
    } catch (e) {
      Store.del(this.TOKEN_KEY);
      toast('Could not connect Spotify', e.message, 'err');
      this.cleanUrl();
      return false;
    }
  },

  async refresh() {
    const t = Store.get(this.TOKEN_KEY, null);
    if (!t || !t.refresh_token) throw new Error('No refresh token available');
    const body = new URLSearchParams({
      client_id: CONFIG.spotify.clientId, grant_type: 'refresh_token', refresh_token: t.refresh_token
    });
    const res = await fetch(CONFIG.spotify.accountsBase + '/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body
    });
    if (!res.ok) throw new Error('Token refresh failed (' + res.status + ')');
    const n = await res.json();
    Store.set(this.TOKEN_KEY, {
      access_token: n.access_token, refresh_token: n.refresh_token || t.refresh_token,
      expires_at: Date.now() + (n.expires_in - 60) * 1000
    });
  },

  async api(path, tries) {
    tries = tries || 0;
    let tok = this.token();
    if (!tok) { await this.refresh(); tok = this.token(); }
    const res = await fetch(CONFIG.spotify.apiBase + path, { headers: { Authorization: 'Bearer ' + tok } });
    if (res.status === 401 && tries < 1) { await this.refresh(); return this.api(path, tries + 1); }
    if (res.status === 403) throw new Error('Spotify refused this request (403). Your app may need Extended Quota Mode, or this scope was not granted.');
    if (res.status === 429) throw new Error('Spotify rate limit reached. Try again in a moment.');
    if (!res.ok) throw new Error('Spotify API error ' + res.status);
    return res.json();
  },

  me() { return this.api('/me'); },
  async getTop(type, range, limit) {
    const d = await this.api('/me/top/' + type + '?time_range=' + range + '&limit=' + (limit || 50));
    const images = i => (i.images && i.images.length ? i.images[i.images.length - 1].url : null);
    if (type === 'artists') {
      return (d.items || []).map((a, i) => ({
        id: a.id, name: a.name, image: images(a), genres: a.genres || [],
        followers: a.followers ? a.followers.total : null, popularity: a.popularity, rank: i + 1, topTrackCount: null
      }));
    }
    return (d.items || []).map((t, i) => ({
      id: t.id, name: t.name, artist: (t.artists[0] || {}).name || 'Unknown',
      artistId: (t.artists[0] || {}).id, album: t.album ? t.album.name : '',
      image: (t.album && t.album.images && t.album.images.length) ? t.album.images[t.album.images.length - 1].url : null,
      popularity: t.popularity, duration_ms: t.duration_ms, explicit: t.explicit, rank: i + 1
    }));
  },
  async getRecentlyPlayed(limit) {
    const d = await this.api('/me/player/recently-played?limit=' + (limit || 50));
    return (d.items || []).map(it => {
      const t = it.track;
      return {
        id: t.id, name: t.name, artist: (t.artists[0] || {}).name || 'Unknown', artistId: (t.artists[0] || {}).id,
        album: t.album ? t.album.name : '',
        image: (t.album && t.album.images && t.album.images.length) ? t.album.images[t.album.images.length - 1].url : null,
        duration_ms: t.duration_ms, played_at: it.played_at
      };
    });
  },
  /* NOTE: Spotify restricted /audio-features for apps created after 27 Nov 2024.
     We request it, and surface a clear 'unavailable' state when refused. */
  async getAudioFeatures(ids) {
    if (!ids || !ids.length) return null;
    const d = await this.api('/audio-features?ids=' + ids.slice(0, 100).join(','));
    const list = (d.audio_features || []).filter(Boolean);
    if (!list.length) return null;
    const keys = ['danceability','energy','valence','acousticness','instrumentalness','liveness','speechiness'];
    const avg = {};
    keys.forEach(k => { avg[k] = list.reduce((s, x) => s + (x[k] || 0), 0) / list.length; });
    avg.tempo = list.reduce((s, x) => s + (x.tempo || 0), 0) / list.length;
    return avg;
  },
  async search(q) {
    const d = await this.api('/search?q=' + encodeURIComponent(q) + '&type=track,artist&limit=12');
    const images = i => (i.images && i.images.length ? i.images[i.images.length - 1].url : null);
    return {
      tracks: ((d.tracks && d.tracks.items) || []).map(t => ({
        id: t.id, name: t.name, artist: (t.artists[0] || {}).name, album: t.album ? t.album.name : '',
        image: (t.album && t.album.images && t.album.images.length) ? t.album.images[t.album.images.length - 1].url : null,
        popularity: t.popularity, duration_ms: t.duration_ms
      })),
      artists: ((d.artists && d.artists.items) || []).map(a => ({
        id: a.id, name: a.name, image: images(a), genres: a.genres || [], followers: a.followers ? a.followers.total : null, popularity: a.popularity
      }))
    };
  },

  disconnect() {
    Store.del(this.TOKEN_KEY); Store.del(this.VERIFIER_KEY); Store.del(this.STATE_KEY);
    Store.del('spotify_connected_at'); Store.del('spotify_account');
    this.connectedAt = null; this.account = null; State.connected = false; State.profile = null;
  },
  cleanUrl() {
    try { history.replaceState({}, '', location.pathname + location.hash); } catch (e) {}
  },

  showSetupHelp() {
    modal({
      title: 'Connect Spotify',
      body:
        '<div class="eyebrow">' + esc(CONFIG.brand.tagline) + '</div>' +
        '<p class="muted small" style="margin-top:0">Statify uses Spotify\'s official <b>Authorization Code + PKCE</b> flow. No client secret is used, and your Spotify password is never requested or stored.</p>' +
        '<div class="banner info mt">' + I.info + '<div><b>Two values are required before this can work.</b><br>Set <code>CONFIG.spotify.clientId</code> and <code>CONFIG.spotify.redirectUri</code> at the top of this file, and register the exact redirect URI in your Spotify Developer Dashboard.</div></div>' +
        '<div class="stack mt" style="gap:12px">' +
          '<div class="field"><label>1. Create a Spotify app</label><span class="hint">dashboard.spotify.com → Create app → copy the public Client ID.</span></div>' +
          '<div class="field"><label>2. Add the redirect URI</label><span class="hint">Add this page\'s URL to the app\'s Redirect URIs list. It must match exactly.</span></div>' +
          '<div class="field"><label>3. Scopes requested</label><span class="hint"><code>' + CONFIG.spotify.scopes.free.join('</code>, <code>') + '</code></span></div>' +
        '</div>' +
        '<div class="banner warn mt">' + I.warn + '<div><b>Not requested:</b> ' + CONFIG.spotify.scopes.notRequested.join(', ') + '. Statify is read-only and asks only for what each feature needs.</div></div>' +
        '<p class="dim tiny mt">Until credentials are supplied the app runs on clearly-labelled sample data. Statify will not claim Spotify is connected until an authenticated request succeeds.</p>',
      foot: '<button class="btn btn-ghost" data-close>Close</button>'
    });
  }
};

/* ============================================================
   Entitlements — the ONE place paid access is decided.
   Production rule: with billing.live === true, entitlements MUST
   come from a server-verified subscription record. Local overrides
   are ignored so a browser cannot unlock paid features.
   ============================================================ */
const Entitlements = {
  resolve() {
    const live = CONFIG.billing.live;
    const sub = State.subscription || { plan: 'free', status: 'inactive' };
    if (live) {
      /* server is authoritative; the client only reflects it */
      if (sub.verifiedByServer && (sub.status === 'active' || sub.status === 'trialing')) return [sub.plan];
      return ['free'];
    }
    /* Demo mode: local preview only, and it is labelled as such in the UI. */
    const plan = (sub.plan === 'plus' && (sub.status === 'active' || sub.status === 'trialing' || sub.demo)) ? 'plus' : 'free';
    return [plan];
  },
  plan() { return this.resolve()[0] || 'free'; },
  isPlus() { return this.plan() === 'plus'; },
  has(feature) {
    const f = CONFIG.features[feature];
    if (!f) return true;
    if (f.tier === 'free') return true;
    return this.isPlus();
  },
  /* demo-only grant; hard-disabled once real billing is live */
  grantDemoPlus() {
    if (CONFIG.billing.live) { toast('Not available', 'Real billing is live — use checkout.', 'err'); return false; }
    State.subscription = { plan: 'plus', status: 'active', provider: 'demo', demo: true, since: new Date().toISOString(), renews: null };
    Store.set('subscription', State.subscription);
    render();
    toast('Demo Plus enabled', 'Local preview only. No payment was taken.', 'info');
    return true;
  },
  cancelDemo() {
    State.subscription = { plan: 'free', status: 'inactive', provider: 'none', demo: true };
    Store.set('subscription', State.subscription);
    render();
    toast('Back to Free', 'Demo subscription removed.', 'info');
  }
};

/* ============================================================
   Billing — never charges anything unless a provider is configured.
   ============================================================ */
const Billing = {
  isLive() { return CONFIG.billing.provider !== 'none' && CONFIG.billing.live; },
  providerName() {
    return { none: 'Not configured', stripe: 'Stripe', paddle: 'Paddle', lemonsqueezy: 'Lemon Squeezy' }[CONFIG.billing.provider] || CONFIG.billing.provider;
  },
  async startCheckout(planId, interval) {
    if (!this.isLive()) {
      this.showNotConfigured(planId, interval);
      return;
    }
    try {
      const res = await fetch(CONFIG.billing.checkoutEndpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan: planId, interval, source: 'statify-web' })
      });
      if (!res.ok) throw new Error('Checkout could not be started (' + res.status + ')');
      const data = await res.json();
      if (data.url) location.href = data.url;
      else throw new Error('Checkout response did not include a redirect URL');
    } catch (e) { toast('Checkout unavailable', e.message, 'err'); }
  },
  async openPortal() {
    if (!this.isLive() || !CONFIG.billing.portalEndpoint) {
      toast('Billing portal not configured', 'A provider must be connected before subscriptions can be managed.', 'err');
      return;
    }
    try {
      const res = await fetch(CONFIG.billing.portalEndpoint, { method: 'POST' });
      const data = await res.json();
      if (data.url) location.href = data.url; else throw new Error('No portal URL returned');
    } catch (e) { toast('Could not open billing portal', e.message, 'err'); }
  },
  showNotConfigured(planId, interval) {
    const plan = CONFIG.pricing.plans[planId] || CONFIG.pricing.plans.plus;
    modal({
      title: 'Payments are not active yet',
      body:
        '<div class="banner warn">' + I.warn + '<div><b>No payment provider is connected.</b> Statify will not take money until the owner configures and tests one. Nothing has been charged.</div></div>' +
        '<p class="muted small mt">Selected: <b>' + esc(plan.name) + '</b> · ' + esc(interval) + ' billing · <b>' + (interval === 'annual' ? money(plan.price.annual) + '/yr' : money(plan.price.monthly) + '/mo') + '</b> <span class="dim">(proposed)</span></p>' +
        '<div class="card card-pad mt"><b class="small">What is already built</b><ul class="feat-list mt-s">' +
          '<li>' + I.check + '<span>Server-side checkout + webhook architecture (state written by the provider, never the browser)</span></li>' +
          '<li>' + I.check + '<span>Billing portal link for cancellation and card updates</span></li>' +
          '<li>' + I.check + '<span>Failed-payment / expired-subscription handling states</span></li>' +
          '<li>' + I.check + '<span>Owner dashboard separating test from live transactions</span></li>' +
        '</ul></div>' +
        '<div class="card card-pad mt"><b class="small">What is required to go live</b><ol class="small muted" style="margin:8px 0 0;padding-left:18px">' +
          '<li>A payment provider account (Stripe is the natural fit for subscriptions)</li>' +
          '<li>A small backend to create Checkout Sessions and receive webhooks</li>' +
          '<li><code>CONFIG.billing.provider</code>, <code>live:true</code> and the three endpoints</li>' +
          '<li>Confirmation of the final prices (currently proposed)</li>' +
        '</ol></div>' +
        '<p class="dim tiny mt">Secrets (secret key, webhook signing secret) belong on the server only. They are never placed in this file.</p>',
      foot: '<button class="btn btn-ghost" data-close>Close</button>' +
            (Entitlements.isPlus() ? '' : '<button class="btn btn-primary" data-demo-plus>Preview Plus locally (demo)</button>'),
      onClick: (e, close) => {
        if (e.target.closest('[data-demo-plus]')) { close(); Entitlements.grantDemoPlus(); }
      }
    });
  }
};

/* ============================================================
   Referrals — design + honest tracking. Rewards are server-verified.
   ============================================================ */
const Referrals = {
  init() {
    if (State.referral) return State.referral;
    const code = (Store.get('referral_code', null)) || this.makeCode();
    Store.set('referral_code', code);
    const r = {
      code,
      link: (location.origin === 'null' ? 'https://statify.app' : location.origin + location.pathname) + '?ref=' + code,
      invited: Store.get('referral_invited', 0),
      verified: Store.get('referral_verified', 0),
      rewardsEarned: Store.get('referral_rewards', 0),
      pendingDays: 0
    };
    State.referral = r;
    return r;
  },
  makeCode() {
    const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = ''; const r = crypto.getRandomValues(new Uint8Array(8));
    for (let i = 0; i < 8; i++) s += a[r[i] % a.length];
    return s;
  },
  /* In production this POSTs to the server, which is the only place a
     reward may be granted. The client never grants anything itself. */
  async claimReward() {
    const r = State.referral;
    if (r.rewardsEarned >= CONFIG.referral.maxRewardsPerAccount) {
      toast('Reward limit reached', 'You have reached the maximum of ' + CONFIG.referral.maxRewardsPerAccount + ' referral rewards.', 'err');
      return;
    }
    toast('Rewards are server-verified', 'A reward is only issued once the invited account is verified and has connected Spotify. That backend is not connected in this build.', 'info');
  }
};

/* ============================================================
   HistoryDB — the personal listening database.
   Append-only daily snapshots. We only ever report what was
   actually recorded; nothing is back-filled or invented.
   ============================================================ */
const HistoryDB = {
  key: 'history',
  load() { return Store.get(this.key, []); },
  /* one snapshot per day; a re-run on the same day replaces that day only */
  save(snapshot) {
    const all = this.load();
    const day = snapshot.date;
    const i = all.findIndex(s => s.date === day);
    if (i >= 0) all[i] = snapshot; else all.push(snapshot);
    all.sort((a, b) => a.date.localeCompare(b.date));
    const cutoff = isoDay(daysAgo(State.collection.retentionDays || 365));
    const pruned = all.filter(s => s.date >= cutoff);
    Store.set(this.key, pruned);
    return pruned.length;
  },
  count() { return this.load().length; },
  firstDate() { const a = this.load(); return a.length ? a[0].date : null; },
  lastDate() { const a = this.load(); return a.length ? a[a.length - 1].date : null; },
  /* ranking movement between two stored snapshots, only for entities present in both */
  movement(type, fromDate, toDate) {
    const all = this.load();
    const a = all.find(s => s.date === fromDate), b = all.find(s => s.date === toDate);
    if (!a || !b) return null;
    const key = type === 'artists' ? 'artists' : 'tracks';
    const mapA = {}; (a[key] || []).forEach(x => { mapA[x.id] = x.rank; });
    return (b[key] || []).map(x => ({
      id: x.id, name: x.name, artist: x.artist, image: x.image,
      now: x.rank, was: mapA[x.id] || null,
      change: mapA[x.id] ? mapA[x.id] - x.rank : null
    })).filter(x => x.was !== null);
  },
  /* seed demo history once so the feature is explorable; clearly labelled sample */
  seedSample() {
    if (this.count()) return this.count();
    const all = [];
    const base = SAMPLE.ranges.medium_term;
    for (let w = 12; w >= 0; w--) {
      const date = isoDay(daysAgo(w * 7));
      const tracks = base.tracks.map(t => ({ id: t.id, name: t.name, artist: t.artist, image: t.image, rank: t.rank }))
        .sort((a, b) => (hashStr(a.id + date) % 89) - (hashStr(b.id + date) % 89))
        .map((t, i) => Object.assign({}, t, { rank: i + 1 }));
      const artists = base.artists.map(t => ({ id: t.id, name: t.name, image: t.image, rank: t.rank }))
        .sort((a, b) => (hashStr(a.id + date + 'a') % 89) - (hashStr(b.id + date + 'a') % 89))
        .map((t, i) => Object.assign({}, t, { rank: i + 1 }));
      all.push({ date, tracks, artists, sample: true });
    }
    Store.set(this.key, all);
    return all.length;
  },
  clear() { Store.del(this.key); }
};

/* ============================================================
   Charts — dependency-free SVG renderers, themed from CSS vars.
   ============================================================ */
const Charts = {
  uid: 0,
  cssv(name, fb) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fb;
  },
  palette(i) {
    const accent = this.cssv('--accent', '#1db954');
    const accents = [accent, this.cssv('--accent-2', '#1ed760'), this.cssv('--info', '#5b9dff'), this.cssv('--violet', '#a06bff'), this.cssv('--warn', '#f5a524'), '#f2555a', '#2fd3c5', '#ff8fb1'];
    return accents[i % accents.length];
  },
  css() {
    if ($('#chart-style')) return;
    const s = document.createElement('style');
    s.id = 'chart-style';
    s.textContent = '.chart .grow{transform-origin:left center;animation:grow .7s var(--ease) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}' +
      '.chart .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s var(--ease) forwards}@keyframes draw{to{stroke-dashoffset:0}}' +
      '.chart .fadein{animation:fade .6s var(--ease) both}@keyframes fade{from{opacity:0}to{opacity:1}}';
    document.head.appendChild(s);
  },

  /* ---------- horizontal bars (HTML) ---------- */
  hbar(el, items, opts) {
    if (!el) return;
    opts = opts || {};
    if (!items || !items.length) { el.innerHTML = Charts.emptyState(opts.emptyTitle || 'No data'); return; }
    const max = Math.max.apply(null, items.map(i => i.value)) || 1;
    el.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px">' + items.map((it, i) => {
      const w = Math.max(2, (it.value / max) * 100);
      const color = it.color || Charts.palette(i);
      return '<div class="row" style="gap:12px">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="row" style="gap:8px"><span class="small" style="font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(it.label) + '</span>' +
          '<span class="spacer tiny dim" style="font-variant-numeric:tabular-nums">' + esc(it.display != null ? it.display : it.value) + '</span></div>' +
          '<div style="height:8px;border-radius:5px;background:var(--bg-4);overflow:hidden;margin-top:6px">' +
            '<i class="grow" style="display:block;height:100%;width:' + w + '%;border-radius:5px;background:' + color + ';animation-delay:' + (i * 55) + 'ms"></i>' +
          '</div>' +
          (it.sub ? '<div class="tiny dim" style="margin-top:4px">' + esc(it.sub) + '</div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
  },

  emptyState(title, msg) {
    return '<div class="empty">' + I.chart + '<h4>' + esc(title) + '</h4><p>' + esc(msg || '') + '</p></div>';
  },

  /* ---------- line / area ---------- */
  line(el, series, opts) {
    if (!el) return;
    Charts.css();
    opts = opts || {};
    const W = 820, H = opts.height || 260, P = { t: 18, r: 14, b: 30, l: 38 };
    const n = Math.max.apply(null, series.map(s => s.points.length));
    if (!n) { el.innerHTML = Charts.emptyState(opts.emptyTitle || 'Nothing recorded yet'); return; }
    const all = series.reduce((a, s) => a.concat(s.points.map(p => p.y)), []);
    let max = Math.max.apply(null, all), min = opts.zeroBase === false ? Math.min.apply(null, all) : 0;
    if (max === min) max = min + 1;
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const X = i => P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const Y = v => P.t + ih - ((v - min) / (max - min)) * ih;
    const uid = 'c' + (++Charts.uid);

    let grid = '', ylab = '';
    for (let g = 0; g <= 4; g++) {
      const v = min + ((max - min) * g) / 4, y = Y(v);
      grid += '<line x1="' + P.l + '" y1="' + y + '" x2="' + (W - P.r) + '" y2="' + y + '" stroke="' + Charts.cssv('--line', 'rgba(255,255,255,.07)') + '"/>';
      ylab += '<text x="' + (P.l - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10.5" fill="' + Charts.cssv('--txt-3', '#7a7a83') + '">' + esc(opts.yFmt ? opts.yFmt(v) : Math.round(v)) + '</text>';
    }
    const labels = series[0].points.map(p => p.x);
    let xlab = '';
    const step = Math.ceil(n / 8);
    labels.forEach((l, i) => {
      if (i % step !== 0 && i !== n - 1) return;
      xlab += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="' + Charts.cssv('--txt-3', '#7a7a83') + '">' + esc(l) + '</text>';
    });

    const body = series.map((s, si) => {
      const color = s.color || Charts.palette(si);
      const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
      const area = d + ' L' + X(s.points.length - 1).toFixed(1) + ' ' + (P.t + ih) + ' L' + X(0).toFixed(1) + ' ' + (P.t + ih) + ' Z';
      return (series.length === 1 ? '<defs><linearGradient id="' + uid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".28"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#' + uid + ')" class="fadein"/>' : '') +
        '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" class="draw"' + (series.length > 1 ? ' style="animation:none;stroke-dasharray:none;stroke-dashoffset:0"' : '') + '/>' +
        s.points.map((p, i) => '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="8" fill="transparent" data-tip="' + esc(p.tip || (s.name + ': ' + p.y)) + '"/>' +
          '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="2.8" fill="' + color + '" class="fadein"/>').join('');
    }).join('');

    el.innerHTML = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + grid + ylab + xlab + body + '</svg>' +
      (series.length > 1 ? '<div class="legend">' + series.map((s, i) => '<span><i class="swatch" style="background:' + (s.color || Charts.palette(i)) + '"></i>' + esc(s.name) + '</span>').join('') + '</div>' : '');
    Charts.bindTips(el);
  },

  /* ---------- donut ---------- */
  donut(el, slices, opts) {
    if (!el) return;
    opts = opts || {};
    slices = slices.filter(s => s.value > 0);
    if (!slices.length) { el.innerHTML = Charts.emptyState(opts.emptyTitle || 'No data'); return; }
    const total = slices.reduce((a, s) => a + s.value, 0);
    const S = 200, R = 78, r = 52, cx = 100, cy = 100;
    let a0 = -Math.PI / 2, paths = '';
    slices.forEach((s, i) => {
      const frac = s.value / total, a1 = a0 + frac * Math.PI * 2;
      const large = frac > 0.5 ? 1 : 0;
      const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
      const xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1), xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
      const color = s.color || Charts.palette(i);
      paths += '<path d="M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
        ' L' + xi1.toFixed(1) + ' ' + yi1.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + xi0.toFixed(1) + ' ' + yi0.toFixed(1) + ' Z"' +
        ' fill="' + color + '" opacity=".92" data-tip="' + esc(s.label + ': ' + (opts.fmt ? opts.fmt(s.value, total) : s.value)) + '" class="fadein" style="animation-delay:' + (i * 40) + 'ms"/>';
      a0 = a1;
    });
    const center = opts.center ? '<text x="100" y="96" text-anchor="middle" font-size="24" font-weight="800" fill="' + Charts.cssv('--txt', '#fff') + '">' + esc(opts.center) + '</text>' +
      '<text x="100" y="114" text-anchor="middle" font-size="10.5" fill="' + Charts.cssv('--txt-3', '#7a7a83') + '">' + esc(opts.centerSub || '') + '</text>' : '';
    el.innerHTML = '<svg class="chart" viewBox="0 0 ' + S + ' ' + S + '" style="max-width:250px;margin:0 auto" role="img">' + paths + center + '</svg>' +
      '<div class="legend" style="justify-content:center">' + slices.map((s, i) => '<span><i class="swatch" style="background:' + (s.color || Charts.palette(i)) + '"></i>' + esc(s.label) + ' <b style="margin-left:4px">' + Math.round((s.value / total) * 100) + '%</b></span>').join('') + '</div>';
    Charts.bindTips(el);
  },

  /* ---------- radar (audio features) ---------- */
  radar(el, axes, opts) {
    if (!el) return;
    opts = opts || {};
    const S = 300, cx = 150, cy = 150, R = 100;
    const n = axes.length;
    const pt = (i, v) => { const a = -Math.PI / 2 + (i / n) * Math.PI * 2; return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)]; };
    let rings = '';
    for (let g = 1; g <= 4; g++) {
      const poly = axes.map((_, i) => pt(i, g / 4).map(x => x.toFixed(1)).join(',')).join(' ');
      rings += '<polygon points="' + poly + '" fill="none" stroke="' + Charts.cssv('--line', 'rgba(255,255,255,.07)') + '"/>';
    }
    let spokes = '', labels = '';
    axes.forEach((a, i) => {
      const p = pt(i, 1);
      spokes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="' + Charts.cssv('--line', 'rgba(255,255,255,.07)') + '"/>';
      const lp = pt(i, 1.19);
      labels += '<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 3).toFixed(1) + '" text-anchor="middle" font-size="10" fill="' + Charts.cssv('--txt-3', '#7a7a83') + '">' + esc(a.label) + '</text>';
    });
    const accent = Charts.cssv('--accent', '#1db954');
    const poly = axes.map((a, i) => pt(i, clamp(a.value, 0, 1)).map(x => x.toFixed(1)).join(',')).join(' ');
    const dots = axes.map((a, i) => { const p = pt(i, clamp(a.value, 0, 1)); return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.4" fill="' + accent + '" data-tip="' + esc(a.label + ': ' + Math.round(a.value * 100) + '%') + '"/>'; }).join('');
    el.innerHTML = '<svg class="chart" viewBox="0 0 ' + S + ' ' + S + '" style="max-width:330px;margin:0 auto" role="img">' + rings + spokes + labels +
      '<polygon points="' + poly + '" fill="' + accent + '" fill-opacity=".18" stroke="' + accent + '" stroke-width="2" class="fadein"/>' + dots + '</svg>';
    Charts.bindTips(el);
  },

  /* ---------- bump chart (ranking movement) ---------- */
  bump(el, rows, periods, opts) {
    if (!el) return;
    opts = opts || {};
    if (!rows.length) { el.innerHTML = Charts.emptyState(opts.emptyTitle || 'Not enough recorded data yet'); return; }
    const W = 820, H = 44 + rows.length * 30, P = { t: 14, r: 96, b: 24, l: 34 };
    const n = periods.length;
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const X = i => P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const Y = rank => P.t + ((rank - 1) / Math.max(1, rows.length - 1)) * ih;
    let grid = '';
    periods.forEach((p, i) => { grid += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="' + Charts.cssv('--txt-3', '#7a7a83') + '">' + esc(p) + '</text>'; });
    const body = rows.map((r, ri) => {
      const color = r.color || Charts.palette(ri);
      const d = r.values.map((v, i) => (v == null ? null : (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1))).filter(Boolean).join(' ');
      const lastI = r.values.length - 1;
      return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="draw"/>' +
        r.values.map((v, i) => v == null ? '' : '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="4" fill="' + color + '" data-tip="' + esc(r.label + ' — ' + periods[i] + ': #' + v) + '"/>').join('') +
        '<text x="' + (X(lastI) + 10) + '" y="' + (Y(r.values[lastI]) + 4) + '" font-size="11" font-weight="600" fill="' + color + '">' + esc(r.label.slice(0, 14)) + '</text>';
    }).join('');
    el.innerHTML = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + grid + body + '</svg>';
    Charts.bindTips(el);
  },

  bindTips(root) {
    const tip = $('#tip');
    $$('[data-tip]', root).forEach(node => {
      node.style.cursor = 'default';
      node.addEventListener('mouseenter', e => {
        tip.textContent = node.getAttribute('data-tip');
        tip.classList.add('show');
        Charts.moveTip(e);
      });
      node.addEventListener('mousemove', Charts.moveTip);
      node.addEventListener('mouseleave', () => tip.classList.remove('show'));
    });
  },
  moveTip(e) {
    const tip = $('#tip');
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > innerHeight - 8) y = e.clientY - h - pad;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
};

/* ============================================================

function coverHTML(item, cls) {
  const name = item.artist || item.name || '';
  const seed = item.artistId || item.id || name;
  const src = item.image || artFor(name, seed);
  return '<img class="cover ' + (cls || '') + '" src="' + esc(src) + '" alt="" loading="lazy" data-name="' + esc(name) + '" data-seed="' + esc(seed) + '">';
}
function sourceBadge() {
  return State.dataSource === 'spotify'
    ? '<span class="badge badge-live"><i class="dot"></i>Live Spotify data</span>'
    : '<span class="badge badge-warn">' + I.info + 'Sample data</span>';
}
function statCard(k, v, s, icon, delta) {
  return '<div class="card stat">' +
    (icon ? '<div class="ico">' + icon + '</div>' : '') +
    '<div class="k">' + esc(k) + '</div>' +
    '<div class="v">' + esc(v) + '</div>' +
    (delta ? '<div class="delta ' + (delta.dir || 'up') + '">' + esc(delta.text) + '</div>' : '') +
    (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>';
}
function lockedBlock(title, desc, placeholder) {
  return '<div class="lock">' + placeholder +
    '<div class="lock-veil"><div class="inner">' + I.lock +
    '<h4>' + esc(title) + '</h4><p>' + esc(desc) + '</p>' +
    '<div class="row" style="justify-content:center;gap:8px">' +
    '<button class="btn btn-primary btn-sm" data-go="upgrade">' + I.crown + 'See Plus</button>' +
    '<button class="btn btn-ghost btn-sm" data-demo-plus>Preview (demo)</button></div>' +
    '</div></div></div>';
}
function skeletonChart(h) {
  return '<div class="chart-wrap" style="padding:20px"><div class="sk" style="height:' + (h || 170) + 'px;border-radius:12px"></div></div>';
}
function trackRow(t, rank, opts) {
  opts = opts || {};
  return '<div class="trow">' +
    (rank != null ? '<span class="rank ' + (rank <= 3 ? 'top' : '') + '">' + rank + '</span>' : '') +
    coverHTML(t) +
    '<div class="meta"><div class="t">' + esc(t.name) + (t.explicit ? ' <span class="badge" style="padding:1px 5px;font-size:9px">E</span>' : '') + '</div>' +
      '<div class="a">' + esc(t.artist) + (t.album ? ' · ' + esc(t.album) : '') + '</div>' +
      (opts.popularity && t.popularity != null ? '<div class="pop"><i style="width:' + t.popularity + '%"></i></div>' : '') +
    '</div>' +
    '<div class="trail">' + (t.played_at ? esc(relTime(t.played_at)) : (t.duration_ms ? fmtDur(t.duration_ms) : '')) +
      (t.popularity != null && opts.popularity ? '<div class="tiny dim">' + t.popularity + '/100</div>' : '') + '</div>' +
  '</div>';
}
function artistCard(a, i) {
  return '<div class="card" style="padding:16px;text-align:center">' +
    '<div style="display:flex;justify-content:center;margin-bottom:11px">' + coverHTML(a, 'lg round') + '</div>' +
    '<div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(a.name) + '</div>' +
    '<div class="tiny dim" style="margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc((a.genres && a.genres[0]) || 'Artist') + '</div>' +
    (a.followers ? '<div class="tiny dim" style="margin-top:6px">' + nf(a.followers) + ' followers</div>' : '') +
    '<div class="row" style="justify-content:center;margin-top:9px"><span class="badge">#' + (a.rank || i + 1) + '</span>' +
      (a.popularity != null ? '<span class="badge">' + a.popularity + ' pop</span>' : '') + '</div></div>';
}
function fmtDur(ms) {
  const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}
function fmtMins(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}
function emptyBox(title, msg, action) {
  return '<div class="empty">' + I.info + '<h4>' + esc(title) + '</h4><p>' + esc(msg) + '</p>' + (action || '') + '</div>';
}

/* derive genre distribution from artists that actually have genres */
function genreSlices(artists, limit) {
  const counts = {};
  (artists || []).forEach(a => (a.genres || []).forEach(g => { counts[g] = (counts[g] || 0) + 1; }));
  return Object.keys(counts).map(k => ({ label: k, value: counts[k] }))
    .sort((a, b) => b.value - a.value).slice(0, limit || 6);
}
function artistShare(artists, limit) {
  return (artists || []).filter(a => a.topTrackCount != null && a.topTrackCount > 0)
    .sort((a, b) => b.topTrackCount - a.topTrackCount).slice(0, limit || 6)
    .map(a => ({ label: a.name, value: a.topTrackCount, display: a.topTrackCount + ' track' + (a.topTrackCount === 1 ? '' : 's') }));
}
/* Per-day play counts. When Spotify is connected we build these from the
   recently-played items Spotify actually returns; otherwise sample data. */
function dailyCounts() {
  if (State.dataSource === 'spotify' && State.data && State.data.recent && State.data.recent.length) {
    const map = {};
    State.data.recent.forEach(r => { if (r.played_at) { const d = isoDay(r.played_at); map[d] = (map[d] || 0) + 1; } });
    const data = Object.keys(map).sort().map(d => ({ date: d, plays: map[d] }));
    if (data.length) return { data, live: true };
  }
  return { data: SAMPLE.daily, live: false };
}
function dailySeries() {
  const c = dailyCounts();
  return c.data.map(d => ({ x: dateLabel(d.date), y: d.plays, tip: new Date(d.date).toDateString() + ' — ' + d.plays + ' play' + (d.plays === 1 ? '' : 's') + (c.live ? '' : ' (sample)') }));
}
function playsRecorded(days) {
  const cutoff = isoDay(daysAgo(days || 30));
  return dailyCounts().data.filter(d => d.date >= cutoff).reduce((s, d) => s + d.plays, 0);
}
function activityNote() {
  return dailyCounts().live ? 'From the plays Spotify returns (roughly the last 50)' : 'Recorded snapshots · sample data in demo mode';
}

            '<div><div class="small" style="font-weight:620">' + new Date(s.date).toDateString() + '</div>' +
            '<div class="tiny dim">' + (s.sample ? 'Sample snapshot (demo)' : 'Recorded snapshot') + ' · ' + (s.tracks || []).length + ' tracks · ' + (s.artists || []).length + ' artists</div></div></div>').join('')

      '</div>';
    } };
