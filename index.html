  /* ---------------- MUSIC ANALYTICS ---------------- */
  analytics() {
    const d = State.data || { tracks: [], artists: [] };
    const plus = Entitlements.has('advancedAnalytics');
    const pop = d.tracks.filter(t => t.popularity != null);
    const avgPop = pop.length ? Math.round(pop.reduce((s, t) => s + t.popularity, 0) / pop.length) : null;
    const avgDur = d.tracks.length ? d.tracks.reduce((s, t) => s + (t.duration_ms || 0), 0) / d.tracks.length : 0;
    const genres = genreSlices(d.artists, 8);
    const diversity = d.artists.length ? (genres.length / Math.max(1, d.artists.length) * 100) : 0;

    const html =
      '<div class="view-head"><div class="row wrap" style="gap:10px;margin-bottom:8px">' + sourceBadge() + '</div>' +
        '<h1>Music analytics</h1><p>Everything here is derived from data Statify can actually see. Where Spotify does not expose a figure, the panel says so rather than guessing.</p></div>' +

      '<div class="grid g4">' +
        statCard('Average popularity', avgPop != null ? avgPop + '/100' : '—', 'Across your top tracks', I.trend) +
        statCard('Average length', avgDur ? fmtDur(avgDur) : '—', 'Of tracks in rotation', I.clock) +
        statCard('Genres represented', String(genres.length), 'Across top artists', I.palette) +
        statCard('Genre diversity', diversity ? Math.round(diversity) + '%' : '—', 'Distinct genres per artist', I.spark) +
      '</div>' +

      '<div class="grid g23 mt">' +
        '<div class="card"><div class="card-head"><div><h2>Popularity distribution</h2><p>Your top tracks bucketed by Spotify popularity score</p></div></div>' +
          '<div class="card-pad" id="c-pop"></div></div>' +
        '<div class="card"><div class="card-head"><div><h2>Genre mix</h2><p>Top artists</p></div></div>' +
          '<div style="padding:14px 8px 0" id="c-genres2"></div></div>' +
      '</div>' +

      '<div class="grid g23 mt">' +
        '<div class="card"><div class="card-head"><div><h2>Audio features</h2><p>Average across your top tracks</p></div></div>' +
          '<div class="card-pad" id="c-features"></div></div>' +
        '<div class="card"><div class="card-head"><div><h2>Listening consistency</h2><p>Recorded plays per day</p></div></div>' +
          '<div class="card-pad" id="c-consistency"></div></div>' +
      '</div>' +

      '<div class="grid g2 mt">' +
        '<div class="card"><div class="card-head"><div><h2>Personalised insights</h2><p>Derived from your own data</p></div>' +
          (plus ? '' : '<span class="spacer badge">' + I.lock + 'Plus</span>') + '</div>' +
          (plus ? '<div class="card-pad" id="c-insights"></div>'
            : lockedBlock('Personalised insights', 'Plus reads your collected data and writes plain-English observations about your listening.', skeletonChart(110))) + '</div>' +
        '<div class="card"><div class="card-head"><div><h2>Period comparison</h2><p>Across Spotify\'s three windows</p></div></div>' +
          (plus ? '<div class="card-pad" id="c-periods"></div>'
            : lockedBlock('Compare time periods', 'See which artists and tracks gained or lost ground between your 4-week, 6-month and all-time charts.', skeletonChart(110))) + '</div>' +
      '</div>';

    return { html, after: () => {
      const buckets = [0, 0, 0, 0, 0];
      pop.forEach(t => buckets[clamp(Math.floor(t.popularity / 20), 0, 4)]++);
      Charts.hbar($('#c-pop'), buckets.map((v, i) => ({ label: (i * 20) + '–' + (i * 20 + 19), value: v, display: v + ' track' + (v === 1 ? '' : 's') })), {});
      Charts.donut($('#c-genres2'), genres, { center: String(genres.length), centerSub: 'genres' });

      const f = (State.dataSource === 'spotify' ? State.audioFeatures : SAMPLE.audioFeatures);
      const fel = $('#c-features');
      if (!f) {
        fel.innerHTML = emptyBox('Audio features unavailable',
          'Spotify restricted the audio-features endpoint for apps created after 27 Nov 2024, so Statify cannot read these values for your account. Nothing is estimated in its place.');
      } else {
        Charts.radar(fel, [
          { label: 'Dance', value: f.danceability }, { label: 'Energy', value: f.energy },
          { label: 'Valence', value: f.valence }, { label: 'Acoustic', value: f.acousticness },
          { label: 'Instrum.', value: f.instrumentalness }, { label: 'Live', value: f.liveness }
        ], {});
        if (State.dataSource !== 'spotify') fel.insertAdjacentHTML('beforeend', '<p class="tiny dim center" style="padding:0 20px 14px">Sample audio features — illustrative, not your account.</p>');
      }

      const days = dailyCounts().data.slice(-28);
      Charts.line($('#c-consistency'), [{ name: 'Plays', color: Charts.cssv('--accent'), points: days.map(d => ({ x: dateLabel(d.date), y: d.plays, tip: new Date(d.date).toDateString() + ' — ' + d.plays + ' plays' })) }], { height: 220, yFmt: v => Math.round(v) });

      const ins = $('#c-insights');
      if (ins) {
        const list = [];
        if (d.artists[0]) list.push('<b>' + esc(d.artists[0].name) + '</b> leads your ' + CONFIG.ranges[State.range].short + ' rotation' + (d.artists[0].genres && d.artists[0].genres[0] ? ', leaning towards ' + esc(d.artists[0].genres[0]) + '.' : '.'));
        const share = artistShare(d.artists, 1)[0];
        if (share) list.push('<b>' + esc(share.label) + '</b> accounts for ' + share.value + ' of your top ' + d.tracks.length + ' tracks.');
        if (avgPop != null) list.push('Your average track popularity is <b>' + avgPop + '/100</b> — ' + (avgPop > 70 ? 'fairly mainstream' : avgPop > 50 ? 'a healthy mix of hits and deep cuts' : 'distinctly off the beaten path') + '.');
        const dc = dailyCounts().data;
        const busiest = dc.slice().sort((a, b) => b.plays - a.plays)[0];
        if (busiest) list.push('Your heaviest recorded day was <b>' + new Date(busiest.date).toDateString() + '</b> with ' + busiest.plays + ' plays.');
        const weekend = dc.filter(dd => [0, 6].includes(new Date(dd.date).getDay()));
        const weekday = dc.filter(dd => ![0, 6].includes(new Date(dd.date).getDay()));
        const wAvg = weekend.reduce((s, x) => s + x.plays, 0) / Math.max(1, weekend.length);
        const dAvg = weekday.reduce((s, x) => s + x.plays, 0) / Math.max(1, weekday.length);
        list.push('You listen <b>' + (wAvg > dAvg ? (wAvg / Math.max(1, dAvg)).toFixed(1) + '× more' : (dAvg / Math.max(1, wAvg)).toFixed(1) + '× more') + '</b> on ' + (wAvg > dAvg ? 'weekends' : 'weekdays') + '.');
        ins.innerHTML = '<ul class="feat-list">' + list.map(x => '<li>' + I.spark + '<span>' + x + '</span></li>').join('') + '</ul>' +
          (State.dataSource !== 'spotify' ? '<p class="tiny dim mt">Based on sample data in demo mode.</p>' : '');
      }

      const per = $('#c-periods');
      if (per) {
        const ranges = ['short_term', 'medium_term', 'long_term'];
        const names = ranges.map(r => SAMPLE.ranges[r].artists.slice(0, 8).map(a => a.id));
        const all = SAMPLE.ranges.long_term.artists.slice(0, 8);
        const rows = all.map(a => ({ label: a.name, values: ranges.map((r, i) => { const idx = names[i].indexOf(a.id); return idx >= 0 ? idx + 1 : null; }) }));
        Charts.bump(per, rows, ranges.map(r => CONFIG.ranges[r].short), {});
        per.insertAdjacentHTML('beforeend', '<p class="tiny dim" style="padding:0 4px 6px">Positions are rank within the top 8 of each Spotify time window.</p>');
      }
    } };
  },

  /* ---------------- UPGRADE / PRICING ---------------- */
  upgrade() {
    const P = CONFIG.pricing;
    const plus = P.plans.plus, free = P.plans.free;
    const interval = State.priceInterval || 'annual';
    const monthly = plus.price.monthly, annual = plus.price.annual;
    const savePct = Math.round(((monthly * 12 - annual) / (monthly * 12)) * 100);
    const isPlus = Entitlements.isPlus();

    const featRows = [

/* report builder — reads only recorded snapshots */
function reportHTML(kind) {
  const all = HistoryDB.load();
  const window = kind === 'week' ? 7 : 30;
  const since = isoDay(daysAgo(window));
  const inWindow = all.filter(s => s.date >= since);
  const d = State.data || { tracks: [], artists: [] };
  if (!inWindow.length) {
    return '<div class="banner warn">' + I.warn + '<div><b>Not enough recorded data for a ' + kind + 'ly report yet.</b> Statify will not fabricate history. Snapshots build up as you use the app — come back once at least one snapshot falls inside the last ' + window + ' days.</div></div>';
  }
  const first = inWindow[0], last = inWindow[inWindow.length - 1];
  const mapFirst = {}; (first.tracks || []).forEach(t => mapFirst[t.id] = t.rank);
  const risers = (last.tracks || []).filter(t => mapFirst[t.id]).map(t => ({ t, d: mapFirst[t.id] - t.rank })).filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 5);
  const fallers = (last.tracks || []).filter(t => mapFirst[t.id]).map(t => ({ t, d: mapFirst[t.id] - t.rank })).filter(x => x.d < 0).sort((a, b) => a.d - b.d).slice(0, 5);
  const plays = dailyCounts().data.filter(x => x.date >= since).reduce((s, x) => s + x.plays, 0);
  return '<div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">' +
    '<div><div class="eyebrow">' + (kind === 'week' ? 'Weekly' : 'Monthly') + ' report</div>' +
    '<h3 style="margin:0">' + dateLabel(first.date) + ' → ' + dateLabel(last.date) + '</h3>' +
    '<p class="tiny dim" style="margin:4px 0 0">' + inWindow.length + ' recorded snapshot' + (inWindow.length === 1 ? '' : 's') + ' · ' + nf(plays) + ' plays in window</p></div>' +
    '<span class="badge">' + (first.sample ? 'Sample snapshots' : 'Recorded snapshots') + '</span></div>' +
    '<div class="grid g3 mt">' +
      '<div><div class="eyebrow">Top artist</div><b>' + esc((last.artists && last.artists[0] && last.artists[0].name) || '—') + '</b></div>' +
      '<div><div class="eyebrow">Top track</div><b>' + esc((last.tracks && last.tracks[0] && last.tracks[0].name) || '—') + '</b></div>' +
      '<div><div class="eyebrow">Current range</div><b>' + esc(CONFIG.ranges[State.range].label) + '</b></div>' +
    '</div>' +
    '<div class="grid g2 mt">' +
      '<div><div class="eyebrow">Rising</div>' + (risers.length ? risers.map(x => '<div class="small" style="margin-bottom:6px">▲ <b>' + esc(x.t.name) + '</b> <span class="dim">+' + x.d + '</span></div>').join('') : '<p class="dim small">No risers recorded.</p>') + '</div>' +
      '<div><div class="eyebrow">Falling</div>' + (fallers.length ? fallers.map(x => '<div class="small" style="margin-bottom:6px">▼ <b>' + esc(x.t.name) + '</b> <span class="dim">' + x.d + '</span></div>').join('') : '<p class="dim small">No fallers recorded.</p>') + '</div>' +
    '</div>';
}

    artists: d.artists.slice(0, 50).map(a => ({ id: a.id, name: a.name, image: a.image, rank: a.rank || 0 }))

function toCSV(rows) {
  if (!rows.length) return '';
  const keys = Object.keys(rows[0]);
  const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return keys.join(',') + '\n' + rows.map(r => keys.map(k => cell(r[k])).join(',')).join('\n');
}

function exportData(kind) {
  if (!Entitlements.has('exports')) {
    toast('Export is a Plus feature', 'Upgrade to export your statistics and reports.', 'err');
    go('upgrade'); return;
  }
  const d = State.data || { tracks: [], artists: [] };
  let name, content;
  if (kind === 'tracks') {
    name = 'statify-top-tracks-' + State.range + '.csv';
    content = toCSV(d.tracks.map((t, i) => ({ rank: i + 1, track: t.name, artist: t.artist, album: t.album, popularity: t.popularity, duration_ms: t.duration_ms })));
  } else if (kind === 'artists') {
    name = 'statify-top-artists-' + State.range + '.csv';
    content = toCSV(d.artists.map((a, i) => ({ rank: i + 1, artist: a.name, genres: (a.genres || []).join('|'), followers: a.followers, popularity: a.popularity })));
  } else if (kind === 'history') {
    name = 'statify-snapshots.csv';
    content = toCSV(HistoryDB.load().map(s => ({ date: s.date, tracks: (s.tracks || []).length, artists: (s.artists || []).length, source: s.sample ? 'sample' : 'recorded' })));
  } else {
    name = 'statify-export.json';
    content = JSON.stringify({
      exported_at: new Date().toISOString(),
      source: State.dataSource, range: State.range,
      top_tracks: d.tracks, top_artists: d.artists, recent: d.recent,
      snapshots: HistoryDB.load(),
      subscription: State.subscription
    }, null, 2);
  }
  const mime = kind === 'full' ? 'application/json' : 'text/csv';
  let url = '';
  try { url = URL.createObjectURL(new Blob([content], { type: mime })); }
  catch (e) { url = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(content); }
  modal({
    title: 'Export — ' + name,
    wide: true,
    body: '<div class="banner info">' + I.info + '<div>Generated from ' + (State.dataSource === 'spotify' ? '<b>your live Spotify data</b>' : '<b>sample data</b>') + '. ' + content.split('\n').length + ' rows.</div></div>' +
      '<textarea class="input mt" rows="12" style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px" readonly>' + esc(content.slice(0, 4000)) + '</textarea>' +
      (content.length > 4000 ? '<p class="tiny dim">Preview truncated — the downloaded file contains everything.</p>' : ''),
    foot: '<a class="btn btn-ghost" href="' + url + '" download="' + esc(name) + '">' + I.download + 'Download file</a>' +
          '<button class="btn btn-primary" data-copy-text="' + esc(content) + '">' + I.copy + 'Copy to clipboard</button>'
  });
}

/* ============================================================
   Event wiring
   ============================================================ */
function onClick(e) {
  const t = e.target;
  const hit = sel => t.closest(sel);

  let n;
  if ((n = hit('[data-go]'))) {
    const id = n.getAttribute('data-go');
    if (id === '__more') return openMoreSheet();
    if (id === 'owner' && !State.ownerMode && !(CONFIG.owner.emails.length && State.profile && CONFIG.owner.emails.includes(State.profile.email))) {
      /* still navigable — the view shows the gate itself */
    }
    closeOverlays(); go(id); return;
  }
  if (hit('[data-connect]')) { closeOverlays(); Spotify.beginAuth(); return; }
  if (hit('[data-account]')) { closeOverlays(); openAccount(); return; }
  if (hit('[data-refresh]')) { closeOverlays(); doRefresh(); return; }
  if (hit('[data-search]')) { const q = $('#q'); doSearch(q ? q.value : State.searchQuery); return; }
  if (hit('[data-snapshot]')) { recordSnapshot(); return; }
  if (hit('[data-print]')) { window.print(); return; }
  if (hit('[data-owner-demo]')) { State.ownerMode = true; render(); return; }
  if (hit('[data-demo-plus]')) { closeOverlays(); Entitlements.grantDemoPlus(); return; }
  if (hit('[data-portal]')) { closeOverlays(); Billing.openPortal(); return; }
  if (hit('[data-cancel-sub]')) {
    closeOverlays();
    if (State.subscription.demo) { Entitlements.cancelDemo(); }
    else { Billing.openPortal(); }
    return;
  }
  if (hit('[data-disconnect]')) { closeOverlays(); confirmDisconnect(); return; }
  if (hit('[data-delete-all]')) { confirmDeleteAll(); return; }
  if (hit('[data-clear-history]')) { confirmClearHistory(); return; }
  if (hit('[data-customise]')) { openCustomise(); return; }
  if (hit('[data-reset-filters]')) { State.filters = { minPop: 0, maxDur: 999 }; render(); return; }
  if (hit('[data-filters]')) { return; }

  if ((n = hit('[data-range]'))) { const r = n.getAttribute('data-range'); loadRange(r).then(render); return; }
  if ((n = hit('[data-set-theme]'))) { applyTheme(n.getAttribute('data-set-theme')) && render(); return; }
  if ((n = hit('[data-interval]'))) { State.priceInterval = n.getAttribute('data-interval'); render(); return; }
  if ((n = hit('[data-buy]'))) {
    const id = n.getAttribute('data-buy');
    if (id.startsWith('supporter:')) return Billing.startCheckout('supporter', 'one_time');
    return Billing.startCheckout(id, id === 'plus' ? (State.priceInterval || 'annual') : 'one_time');
  }
  if ((n = hit('[data-export]'))) { exportData(n.getAttribute('data-export')); return; }
  if ((n = hit('[data-report]'))) { const k = n.getAttribute('data-report'); const o = $('#report-out'); if (o) o.innerHTML = reportHTML(k); return; }
  if ((n = hit('[data-toggle]'))) {
    const key = n.getAttribute('data-toggle');
    State.collection[key] = !State.collection[key];
    Store.set('collection', State.collection);
    n.classList.toggle('on', State.collection[key]);
    n.setAttribute('aria-checked', String(State.collection[key]));
    return;
  }
  if ((n = hit('[data-copy]'))) { copy(n.getAttribute('data-copy')); return; }
  if ((n = hit('[data-copy-text]'))) { copy(n.getAttribute('data-copy-text')); return; }
}

function onInput(e) {
  const t = e.target;
  if (t.matches('[data-filter]')) {
    const k = t.getAttribute('data-filter');
    State.filters = State.filters || { minPop: 0, maxDur: 999 };
    State.filters[k] = Number(t.value);
    const lab = t.closest('.field') && t.closest('.field').querySelector('label');
    if (lab) lab.textContent = (k === 'minPop' ? 'Minimum popularity — ' : 'Maximum length — ') + (k === 'minPop' ? t.value : t.value + 's');
  }
}

function onChange(e) {
  const t = e.target;
  if (t.matches('[data-filter]')) { render(); return; }
  if (t.matches('[data-retention]')) {
    State.collection.retentionDays = Number(t.value);
    Store.set('collection', State.collection);
    toast('Retention updated', 'Snapshots older than ' + t.value + ' days will be removed.', 'ok');
    return;
  }
}

function onImgError(e) {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.classList.contains('cover') && !img.dataset.fb) {
    img.dataset.fb = '1';
    img.src = artFor(img.dataset.name || 'Statify', img.dataset.seed || img.dataset.name || '');
  }
}

function closeOverlays() { $$('.overlay').forEach(o => o.remove()); }

function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('Copied', 'Copied to clipboard.', 'ok'), () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied', 'Copied to clipboard.', 'ok'); } catch (e) { toast('Copy failed', 'Select the text manually.', 'err'); }
  ta.remove();
}

function confirmDisconnect() {
  modal({
    title: 'Disconnect Spotify?',
    body: '<p class="small muted" style="margin-top:0">This deletes the stored access and refresh tokens from this browser immediately. Statify will fall back to sample data until you reconnect.</p>' +
      '<div class="banner info mt">' + I.info + '<div>Your snapshots stay unless you erase them separately. You can also revoke access entirely from your Spotify account page.</div></div>',
    foot: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" data-confirm-disconnect>Disconnect</button>',
    onClick: (e, close) => {
      if (e.target.closest('[data-confirm-disconnect]')) {
        Spotify.disconnect();
        State.dataSource = 'sample';
        close();
        loadRange(State.range).then(render);
        toast('Spotify disconnected', 'Tokens removed. Statify is back on sample data.', 'ok');
      }
    }
  });
}

function confirmDeleteAll() {
  modal({
    title: 'Delete all Statify data?',
    body: '<p class="small muted" style="margin-top:0">This removes every piece of Statify data stored in this browser: snapshots, preferences, theme, referral code and Spotify tokens. It cannot be undone.</p>' +
      '<div class="banner warn">' + I.warn + '<div>In a production deployment this would also queue a server-side deletion request covering your account record.</div></div>',
    foot: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" data-confirm-delete>Delete everything</button>',
    onClick: (e, close) => {
      if (e.target.closest('[data-confirm-delete]')) {
        const n = Store.wipeAll();
        close();
        toast('Data deleted', n + ' stored items removed. Reloading…', 'ok');
        setTimeout(() => location.reload(), 900);
      }
    }
  });
}

function confirmClearHistory() {
  modal({
    title: 'Erase snapshot archive?',
    body: '<p class="small muted" style="margin-top:0">Deletes the ' + HistoryDB.count() + ' dated snapshots Statify has recorded. Trend charts will be empty until new snapshots accumulate.</p>',
    foot: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" data-confirm-clear>Erase archive</button>',
    onClick: (e, close) => {
      if (e.target.closest('[data-confirm-clear]')) {
        HistoryDB.clear(); close(); render();
        toast('Archive erased', 'All snapshots removed.', 'ok');
      }
    }
  });
}

function openCustomise() {
  if (!Entitlements.has('customDashboard')) {
    toast('Custom layout is a Plus feature', 'Upgrade to arrange your dashboard.', 'err'); go('upgrade'); return;
  }
  State.layout = State.layout || { tiles: null };
  const all = ['tracks', 'artists', 'analytics', 'history', 'search', 'reports', 'referrals', 'settings'];
  const on = State.layout.tiles || all.slice();
  modal({
    title: 'Customise dashboard',
    body: '<p class="small muted" style="margin-top:0">Choose which shortcuts appear in “Jump back in”.</p><div class="grid g2">' +
      all.map(id => '<button class="card" style="padding:12px;display:flex;align-items:center;gap:9px;text-align:left" data-tile="' + id + '">' +
        '<span style="width:20px;height:20px;border-radius:6px;border:1.5px solid var(--accent-line);display:grid;place-items:center;background:' + (on.includes(id) ? 'var(--accent)' : 'transparent') + ';color:var(--accent-ink)">' + (on.includes(id) ? I.check : '') + '</span>' +
        '<span class="small" style="font-weight:620;text-transform:capitalize">' + id + '</span></button>').join('') + '</div>',
    foot: '<button class="btn btn-ghost" data-close>Done</button>',
    onClick: (e) => {
      const b = e.target.closest('[data-tile]');
      if (!b) return;
      const id = b.getAttribute('data-tile');
      let tiles = (State.layout.tiles || all.slice()).slice();
      tiles = tiles.includes(id) ? tiles.filter(x => x !== id) : tiles.concat([id]);
      State.layout.tiles = tiles; Store.set('layout', State.layout);
      render();
      const mark = b.querySelector('span');
      if (mark) { mark.style.background = tiles.includes(id) ? 'var(--accent)' : 'transparent'; mark.innerHTML = tiles.includes(id) ? I.check : ''; }
    }
  });
}

/* ============================================================
   Boot
   ============================================================ */
let booted = false;
async function boot() {
  if (booted) return; booted = true;
  setTimeout(hideSplash, 6000); /* failsafe: never leave the loading screen stuck */
  State.filters = State.filters || { minPop: 0, maxDur: 999 };
  State.collection = Object.assign({}, CONFIG.privacy, State.collection || {});
  document.documentElement.setAttribute('data-theme', State.theme);

  /* referral code from the URL is stored, never trusted for a reward */
  const ref = new URLSearchParams(location.search).get('ref');
  if (ref) { Store.set('referred_by', ref); }

  State.connected = Spotify.isReady();
  if (State.connected) Spotify.account = Store.get('spotify_account', null);
  await Spotify.handleRedirect();
  if (Spotify.isReady()) { State.connected = true; Spotify.account = Store.get('spotify_account', null); }

  if (State.collection.collectionOptIn) HistoryDB.seedSample();
  Referrals.init();

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('error', onImgError, true);
  window.addEventListener('hashchange', () => { State.view = currentRoute(); render(); });

  await loadRange(State.range);
  if (State.dataSource === 'spotify') {
    const ids = State.data.tracks.map(t => t.id).filter(Boolean).slice(0, 50);
    const f = await DataService.getAudioFeatures(ids);
    State.audioFeatures = f.items;
  }
  const firstRun = !Store.get('onboarded', false);
  render();
  hideSplash();

  if (!State.connected) {
    if (firstRun) setTimeout(showOnboarding, 300);
    else setTimeout(() => toast('Demo mode', 'Statify is showing sample data. Connect Spotify in Settings to load your own stats.', 'info'), 700);
  }
}

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();

</script>
</body>
</html>
